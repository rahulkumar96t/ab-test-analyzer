# Minimal spec for tests/fixtures/tiny_experiment.csv (arms named differently on purpose).
name = "tiny"
control = "old_checkout"
treatment = "new_checkout"
look_column = "day"

[primary]
name = "conversion"
kind = "binary"
column = "converted"

[[secondary]]
name = "revenue"
kind = "continuous"
column = "revenue"
covariate = "pre_revenue"
robust = true

[[secondary]]
name = "revenue_per_session"
kind = "ratio"
numerator = "revenue"
denominator = "sessions"

[[guardrails]]
name = "page_load_ms"
kind = "continuous"
column = "page_load_ms"
direction = "decrease"
margin = 0.05
