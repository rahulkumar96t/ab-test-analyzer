[project]
name = "ab-test-analyzer"
version = "0.1.0"
description = "Statistics toolkit and CLI for online controlled experiments: SRM and guardrail checks, frequentist and Bayesian tests, CUPED, sequential testing, power analysis and Monte-Carlo validation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.15",
]

[project.scripts]
abtest = "abtest.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "abtest"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]

[tool.ruff.format]
quote-style = "double"
